[package]
name = "nova"
version = "0.1.1"
description = "Nova — AI 编程 CLI 工具桌面管理客户端"
authors = ["苦鼎茶 <yingcongshaw@gmail.com>", "X-Xiaohuabao"]
edition = "2021"
license = "MIT"
default-run = "nova"

[lib]
name = "nova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", default-features = false, features = ["fs"] } # 远程访问静态资源兜底（RA3）
rand = "0.9" # 远程访问配对码随机生成（RA4）
sha2 = "0.10" # 远程访问会话令牌仅存哈希（RA4）
rusqlite = { version = "0.35", features = ["bundled"] }
portable-pty = "0.8"
keyring = "3"
base64 = "0.22"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
walkdir = "2"
dirs = "6"
async-trait = "0.1"
once_cell = "1"
ttf-parser = "0.25"
which = "8.0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
